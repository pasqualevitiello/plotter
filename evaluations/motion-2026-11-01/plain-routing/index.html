<svg xmlns="http://www.w3.org/2000/svg" fill="none" focusable="false" stroke="#171717" stroke-width="1" stroke-opacity="0.8" viewBox="0 0 560 440" style="overflow:visible;font-family:Cal Sans, sans-serif;font-optical-sizing:auto;font-synthesis:none;font-variation-settings:'GEOM' 25;font-weight:400;color:#171717" width="560" height="440" role="img" aria-labelledby="sys-02-plotter-title" aria-describedby="sys-02-plotter-desc"><title id="sys-02-plotter-title">A connection, located</title><desc id="sys-02-plotter-desc">Three inputs meet three outputs on a regular switching grid. A single closed junction connects B to 02, turning an abstract matrix into a precise route. One request travels from B, turns at the selected junction, and arrives at 02.</desc><g opacity="0.1" stroke-width="1" stroke-opacity="0.6"><path d="M184 100V324 M248 100V324 M312 100V324 M376 100V324" /><path d="M168 116H392 M168 180H392 M168 244H392 M168 308H392" /></g><g opacity="0.28" stroke-width="1" stroke-opacity="0.6"><path d="M176 116h8v-8 M376 108v8h8 M176 308h8v8 M376 316v-8h8" /><path d="M280 88V112 M104 212H112 M400 212H424 M280 308V320" stroke-dasharray="3 5" /><rect height="32" width="32" x="264" y="196" /><circle cx="280" cy="212" r="16" /><path d="M291.3 200.7 328 164H372" /></g><g opacity="0.4" stroke-width="1" stroke-opacity="0.75"><path d="M124 148H212 M220 148H276 M284 148H340 M348 148H392" /><path d="M284 212H340 M348 212H392" /><path d="M124 276H212 M220 276H276 M284 276H340 M348 276H392" /><path d="M216 100V144 M216 152V208 M216 216V272 M216 280V336" /><path d="M280 100V144 M280 152V208" /><path d="M344 100V144 M344 152V208 M344 216V272 M344 280V336" /></g><path d="M124 212H212 M220 212H276 M280 216V272 M280 280V336" stroke-width="1" stroke-opacity="1" /><g stroke-width="1" stroke-opacity="0.7"><circle cx="216" cy="148" r="4" /><circle cx="216" cy="212" r="4" /><circle cx="216" cy="276" r="4" /><circle cx="280" cy="148" r="4" /><circle cx="280" cy="212" r="4" /><circle cx="280" cy="276" r="4" /><circle cx="344" cy="148" r="4" /><circle cx="344" cy="212" r="4" /><circle cx="344" cy="276" r="4" /></g><circle cx="280" cy="212" fill="#171717" r="3" stroke="none" /><g stroke-width="1" stroke-opacity="0.85"><circle cx="120" cy="148" r="4" /><circle cx="120" cy="212" r="4" /><circle cx="120" cy="276" r="4" /><circle cx="216" cy="340" r="4" /><circle cx="280" cy="340" r="4" /><circle cx="344" cy="340" r="4" /></g><g opacity="0.48" stroke-width="1" stroke-opacity="0.65"><path d="M216 76H344 M216 68v16 M280 68v16 M344 68v16 m-132-4 8-8 m56 8 8-8 m56 8 8-8" /><path d="M424 148V276 M416 148h16 M416 212h16 M416 276h16 m-12-124 8-8 m-8 72 8-8 m-8 72 8-8" /><path d="M216 92V64 M344 92V64 M400 148H440 M400 276H440" opacity="0.5" /></g><g fill="#171717" font-size="10" opacity="0.52" stroke="none"><text text-anchor="middle" x="248" y="61">u</text><text text-anchor="middle" x="312" y="61">u</text><text x="438" y="184">u</text><text x="438" y="248">u</text><text x="380" y="167">B / 02</text><g text-anchor="end"><text x="100" y="152">A</text><text x="100" y="216">B</text><text x="100" y="280">C</text></g><g text-anchor="middle"><text x="216" y="365">01</text><text x="280" y="365">02</text><text x="344" y="365">03</text></g></g><g opacity="0.28" stroke-width="1" stroke-opacity="0.6"><path d="M100 96h12 M106 90v12 M448 354h12 M454 348v12" /></g><g id="still" fill="#171717" stroke="none"><circle cx="120" cy="212" r="2.4"/><circle cx="280" cy="340" r="2.4"/></g>
<g id="motion" aria-hidden="true" opacity="0">
  <circle id="source" cx="120" cy="212" r="2.7" fill="#171717" stroke="none"/>
  <circle id="junction" cx="280" cy="212" r="8" stroke="#171717" stroke-opacity="1" fill="none" opacity="0"/>
  <circle id="arrival" cx="280" cy="340" r="7" stroke="#171717" stroke-opacity="1" fill="none" opacity="0"/>
  <circle id="destination" cx="280" cy="340" r="2.7" fill="#171717" stroke="none" opacity="0"/>
  <circle id="request" cx="120" cy="212" r="3.5" fill="#171717" stroke="#fff" stroke-width="1.5" stroke-opacity="1" opacity="0"/>
</g></svg>

</main>
<script>
(() => {
  'use strict';
  const duration = 6.4;
  const elements = Object.fromEntries(['still', 'motion', 'source', 'junction', 'arrival', 'destination', 'request'].map(id => [id, document.getElementById(id)]));
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
  const clamp = value => Math.max(0, Math.min(1, value));
  const progress = (time, start, end) => clamp((time - start) / (end - start));
  const smooth = value => value * value * (3 - 2 * value);
  const fade = (time, start, end) => smooth(progress(time, start, end));
  const opacity = (id, value) => elements[id].setAttribute('opacity', value.toFixed(4));
  let frame = null;
  let paused = false;
  let epoch = null;

  // Timing is shared by playback and the review hook; all values are absolute.
  function render(time) {
    opacity('still', 0);
    opacity('motion', 1);
    opacity('source', fade(time, 0.25, 0.65) * (1 - fade(time, 1, 1.25)));
    const horizontal = smooth(progress(time, 1, 2.4));
    const vertical = smooth(progress(time, 2.8, 4));
    elements.request.setAttribute('cx', (120 + 160 * horizontal).toFixed(3));
    elements.request.setAttribute('cy', (212 + 128 * vertical).toFixed(3));
    opacity('request', fade(time, 0.8, 1) * (1 - fade(time, 4, 4.15)));
    const junctionProgress = fade(time, 2.25, 3.1);
    elements.junction.setAttribute('r', (6 + 4 * junctionProgress).toFixed(3));
    opacity('junction', 0.36 * fade(time, 2.25, 2.5) * (1 - fade(time, 2.75, 3.1)));
    const arrivalProgress = fade(time, 4, 4.8);
    elements.arrival.setAttribute('r', (5 + 5 * arrivalProgress).toFixed(3));
    opacity('arrival', 0.36 * fade(time, 4, 4.15) * (1 - fade(time, 4.3, 4.8)));
    opacity('destination', fade(time, 4, 4.15) * (1 - fade(time, 5.1, 5.7)));
  }

  function stop() {
    if (frame !== null) cancelAnimationFrame(frame);
    frame = null;
  }

  function tick(now) {
    if (epoch === null) epoch = now;
    render(((now - epoch) / 1000) % duration);
    frame = requestAnimationFrame(tick);
  }

  function updatePlayback() {
    stop();
    if (paused) return;
    if (reducedMotion.matches) {
      opacity('motion', 0);
      opacity('still', 1);
      return;
    }
    epoch = null;
    render(0);
    frame = requestAnimationFrame(tick);
  }

  window.study = Object.freeze({
    duration,
    seek(seconds) {
      if (!Number.isFinite(seconds)) throw new TypeError('seek requires finite seconds');
      paused = true;
      stop();
      render(Math.max(0, Math.min(duration, seconds)));
    }
  });
  reducedMotion.addEventListener('change', updatePlayback);
  updatePlayback();
})();
</script>
