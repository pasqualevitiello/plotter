<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>An assembly of parts</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; color: #171717; }
  .study { width: min(100%, 560px); margin: 0 auto; }
  svg { display: block; width: 100%; height: auto; overflow: hidden; font-family: "Cal Sans", sans-serif; font-optical-sizing: auto; font-synthesis: none; font-variation-settings: "GEOM" 25; font-weight: 400; }
  .identifier { font-variation-settings: "GEOM" 0; }
</style>
</head>
<body>
<main class="study">
<svg xmlns="http://www.w3.org/2000/svg" width="560" height="440" viewBox="0 0 560 440" fill="none" stroke="currentColor" stroke-width="1" stroke-opacity="0.8" role="img" aria-labelledby="title" aria-describedby="description" focusable="false">
<title id="title">An assembly of parts</title>
<desc id="description">An icon, Workspace label, and Ready status settle into one carrier. The completed row leaves intact, making room for the next assembly.</desc>
<metadata>Conceptual UI assembly, adapted from the supplied editable SVG. One unit is one SVG unit. Rigid parts move 137 units vertically; the label also moves 11 units left. This is a construction analogy, not a mechanical model. The unanimated artwork is the supplied exploded-and-complete composition.</metadata>
<g id="scene">
  <defs>
    <mask id="entry-clearance" maskUnits="userSpaceOnUse" x="0" y="0" width="560" height="440">
      <rect width="560" height="440" fill="white" stroke="none"/>
      <rect data-mask="icon" x="144" y="124" width="40" height="40" rx="7" fill="black" stroke="none"/>
      <rect data-mask="label" x="211" y="134" width="76" height="20" rx="2" fill="black" stroke="none"/>
      <rect data-mask="pill" x="330" y="126" width="86" height="36" rx="18" fill="black" stroke="none"/>
    </mask>
  </defs>
  <g opacity="0.1" stroke-opacity="0.6" data-scaffold="">
    <path d="M128 112H432 M128 144H140 M188 144H204 M306 144H326 M420 144H432 M112 248H120 M440 248H448 M112 281H120 M440 281H448 M112 314H120 M440 314H448"/>
    <g data-guide="icon"><path d="M148 112V120 M148 168V240 M148 322V334 M180 112V120 M180 168V240 M180 322V334"/></g>
    <g data-guide="label"><path d="M204 112V136 M204 164V240 M204 322V334"/></g>
    <g data-guide="pill"><path d="M334 112V122 M334 166V240 M334 322V334 M412 112V122 M412 166V240 M412 322V334"/></g>
  </g>
  <g opacity="0.34" stroke-opacity="0.6">
    <g data-arrow="icon"><path d="M164 172V240" stroke-dasharray="3 6"/><path d="m160 207 4 5 4-5"/></g>
    <g data-arrow="label"><path d="M252 164V240" stroke-dasharray="3 6"/><path d="m248 207 4 5 4-5"/></g>
    <g data-arrow="pill"><path d="M373 166V240" stroke-dasharray="3 6"/><path d="m369 207 4 5 4-5"/></g>
    <path d="M128 239v-10h20 M412 229h20v10 M118 248h20 M128 238v20 M422 314h20 M432 304v20"/>
  </g>
  <rect data-carrier="" height="66" rx="12" width="304" x="128" y="248" stroke-opacity="0.95" mask="url(#entry-clearance)"/>
  <g data-part="icon" stroke-opacity="0.95">
    <rect height="32" rx="6" width="32" x="148" y="128"/>
    <path d="M156 136h6v6h-6z M166 136h6v6h-6z M156 146h6v6h-6z M166 146h6v6h-6z" opacity="0.7"/>
  </g>
  <g data-part="label"><text x="215" y="148" fill="currentColor" font-size="12" opacity="0.78" stroke="none">Workspace</text></g>
  <g data-part="pill">
    <g stroke-opacity="0.95"><rect height="28" rx="14" width="78" x="334" y="130"/><path d="m346 144 3 3 5-6" opacity="0.7"/></g>
    <text x="363" y="148" fill="currentColor" font-size="10" opacity="0.58" stroke="none">Ready</text>
  </g>
  <!-- This second view is retained only for the readable no-JS/reduced-motion still. -->
  <g data-still-target="">
    <g stroke-opacity="0.95"><rect height="32" rx="6" width="32" x="148" y="265"/><path d="M156 273h6v6h-6z M166 273h6v6h-6z M156 283h6v6h-6z M166 283h6v6h-6z" opacity="0.7"/><rect height="28" rx="14" width="78" x="334" y="267"/><path d="m346 281 3 3 5-6" opacity="0.7"/></g>
    <text x="204" y="285" fill="currentColor" font-size="12" opacity="0.78" stroke="none">Workspace</text>
    <text x="363" y="285" fill="currentColor" font-size="10" opacity="0.58" stroke="none">Ready</text>
  </g>
  <g opacity="0.45" stroke-opacity="0.65">
    <path data-label-dimension="" d="M204 156H298 M204 152v8 M298 152v8"/>
    <path d="M128 344H432 M128 337v14 M432 337v14 m-308-3 8-8 m296 8 8-8 M180 326H204 M180 322v8 M204 322v8"/>
  </g>
  <g fill="currentColor" font-size="10" opacity="0.58" stroke="none">
    <text data-number="icon" class="identifier" text-anchor="middle" x="164" y="104">01</text>
    <text data-number="label" class="identifier" text-anchor="middle" x="252" y="104">02</text>
    <text data-number="pill" class="identifier" text-anchor="middle" x="373" y="104">03</text>
    <text text-anchor="middle" x="280" y="364">3 parts / 1 composition</text>
  </g>
</g>
<g opacity="0.32" stroke-opacity="0.6"><path d="M100 82h12 M106 76v12 M448 342h12 M454 336v12 M266 382h28 M280 376v12"/></g>
</svg>
</main>
<script>
(() => {
  'use strict';
  // All playback and review positions are evaluated by this one authored timeline.
  const DURATION = 9.6;
  const beats = {
    icon: { start: 0.70, end: 1.70, x: 0 },
    label: { start: 1.35, end: 2.35, x: -11 },
    pill: { start: 2.00, end: 3.00, x: 0 },
    index: { start: 5.80, end: 8.40 }
  };
  const clamp = n => Math.max(0, Math.min(1, n));
  const phase = (t, a, b) => clamp((t - a) / (b - a));
  const place = n => n * n * (3 - 2 * n);
  const index = n => n * n * n * (n * (6 * n - 15) + 10);
  const scene = document.getElementById('scene');
  const next = scene.cloneNode(true);
  next.id = 'next-scene';
  next.querySelector('mask').id = 'next-entry-clearance';
  next.querySelector('[data-carrier]').setAttribute('mask', 'url(#next-entry-clearance)');
  next.setAttribute('aria-hidden', 'true');
  scene.after(next);
  const collect = node => ({
    node,
    parts: Object.fromEntries(['icon', 'label', 'pill'].map(name => [name, {
      part: node.querySelector(`[data-part="${name}"]`),
      mask: node.querySelector(`[data-mask="${name}"]`),
      guide: node.querySelector(`[data-guide="${name}"]`),
      arrow: node.querySelector(`[data-arrow="${name}"]`),
      number: node.querySelector(`[data-number="${name}"]`)
    }])),
    still: node.querySelector('[data-still-target]'),
    labelDimension: node.querySelector('[data-label-dimension]')
  });
  const current = collect(scene);
  const upcoming = collect(next);
  function pose(view, t, still = false) {
    view.still.style.display = still ? '' : 'none';
    for (const [name, spec] of Object.entries(beats)) {
      if (name === 'index') continue;
      const group = view.parts[name];
      const progress = place(phase(t, spec.start, spec.end));
      const transform = `translate(${spec.x * progress} ${137 * progress})`;
      group.part.setAttribute('transform', transform);
      group.mask.setAttribute('transform', transform);
      // Supporting witnesses withdraw before the rigid part crosses them.
      const support = 1 - place(phase(t, spec.start - 0.20, spec.start));
      group.guide.setAttribute('opacity', support);
      group.arrow.setAttribute('opacity', support);
      group.number.setAttribute('opacity', 1 - place(phase(t, spec.start, spec.start + 0.40)));
      if (name === 'label') view.labelDimension.setAttribute('opacity', support);
    }
  }
  function render(t) {
    const shift = 560 * index(phase(t, beats.index.start, beats.index.end));
    current.node.setAttribute('transform', `translate(${shift} 0)`);
    upcoming.node.setAttribute('transform', `translate(${shift - 560} 0)`);
    upcoming.node.style.display = shift > 0 ? '' : 'none';
    pose(current, t);
    pose(upcoming, 0);
  }
  function renderStill() {
    current.node.setAttribute('transform', 'translate(0 0)');
    upcoming.node.style.display = 'none';
    pose(current, 0, true);
  }
  let time = 0, previous = null, frame = null, manual = false, onScreen = true;
  const motion = matchMedia('(prefers-reduced-motion: reduce)');
  function stop() {
    cancelAnimationFrame(frame);
    frame = null;
    previous = null;
  }
  function tick(timestamp) {
    if (previous !== null) time = (time + (timestamp - previous) / 1000) % DURATION;
    previous = timestamp;
    render(time);
    frame = requestAnimationFrame(tick);
  }
  function sync() {
    stop();
    if (motion.matches && !manual) { renderStill(); return; }
    if (!manual && !document.hidden && onScreen) frame = requestAnimationFrame(tick);
  }
  window.study = {
    duration: DURATION,
    seek(seconds) {
      if (!Number.isFinite(seconds)) throw new TypeError('seek expects finite seconds');
      manual = true;
      stop();
      time = Math.max(0, Math.min(DURATION, seconds));
      render(time);
      return time;
    }
  };
  document.addEventListener('visibilitychange', sync);
  motion.addEventListener('change', () => { manual = false; sync(); });
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(entries => {
      onScreen = entries[0].isIntersecting;
      sync();
    }).observe(document.querySelector('.study'));
  }
  if (motion.matches) renderStill(); else render(0);
  sync();
})();
</script>
</body>
</html>
