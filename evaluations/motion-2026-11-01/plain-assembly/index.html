<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Workspace assembly</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #fff; }
    body { display: grid; place-items: center; }
    .illustration { width: min(100%, 560px); aspect-ratio: 560 / 440; }
    svg { display: block; width: 100%; height: auto; overflow: visible;
      font-family: "Cal Sans", Arial, sans-serif; font-optical-sizing: auto;
      font-synthesis: none; font-variation-settings: 'GEOM' 25; font-weight: 400; }
  </style>
</head>
<body>
  <main class="illustration">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#171717" stroke-width="1" stroke-opacity="0.8" viewBox="0 0 560 440" width="560" height="440" role="img" aria-labelledby="title description">
      <title id="title">Workspace assembly</title>
      <desc id="description">Three parts — an icon, a Workspace label, and a Ready status — settle into a single carrier, pause together, and return to their exploded arrangement.</desc>
      <g opacity="0.1" stroke-opacity="0.6">
        <path d="M128 112H432 M128 144H140 M188 144H204 M306 144H326 M420 144H432 M112 248H120 M440 248H448 M112 281H120 M440 281H448 M112 314H120 M440 314H448"/>
        <path d="M148 112V120 M148 168V240 M148 322V334 M180 112V120 M180 168V240 M180 322V334 M204 112V136 M204 164V240 M204 322V334 M334 112V122 M334 166V240 M334 322V334 M412 112V122 M412 166V240 M412 322V334"/>
      </g>
      <g stroke-opacity="0.6">
        <g id="route-icon" opacity="0.06"><path d="M164 172V240" stroke-dasharray="3 6"/><path d="m160 207 4 5 4-5"/></g>
        <g id="route-label" opacity="0.06"><path d="M252 164V240" stroke-dasharray="3 6"/><path d="m248 207 4 5 4-5"/></g>
        <g id="route-pill" opacity="0.06"><path d="M373 166V240" stroke-dasharray="3 6"/><path d="m369 207 4 5 4-5"/></g>
        <g opacity="0.34"><path d="M128 239v-10h20 M412 229h20v10 M118 248h20 M128 238v20"/><path d="M422 314h20 M432 304v20"/></g>
      </g>
      <rect x="128" y="248" width="304" height="66" rx="12" stroke-opacity="0.95"/>
      <g stroke-opacity="0.95">
        <g id="slot-icon" opacity="0"><rect x="148" y="265" width="32" height="32" rx="6"/><path d="M156 273h6v6h-6z M166 273h6v6h-6z M156 283h6v6h-6z M166 283h6v6h-6z" opacity="0.7"/></g>
        <g id="slot-label" opacity="0"><text x="204" y="285" fill="#171717" stroke="none" font-size="12">Workspace</text></g>
        <g id="slot-pill" opacity="0"><rect x="334" y="267" width="78" height="28" rx="14"/><path d="m346 281 3 3 5-6" opacity="0.7"/><text x="363" y="285" fill="#171717" stroke="none" font-size="10">Ready</text></g>
      </g>
      <g id="measure-label" opacity="0.08" stroke-opacity="0.65"><path d="M204 156H298 M204 152v8 M298 152v8"/></g>
      <g id="part-icon" transform="translate(0 137)" stroke-opacity="0.95">
        <rect x="148" y="128" width="32" height="32" rx="6"/>
        <path d="M156 136h6v6h-6z M166 136h6v6h-6z M156 146h6v6h-6z M166 146h6v6h-6z" opacity="0.7"/>
      </g>
      <g id="part-label" transform="translate(-11 137)"><text x="215" y="148" fill="#171717" stroke="none" opacity="0.78" font-size="12">Workspace</text></g>
      <g id="part-pill" transform="translate(0 137)" stroke-opacity="0.95">
        <rect x="334" y="130" width="78" height="28" rx="14"/>
        <path d="m346 144 3 3 5-6" opacity="0.7"/>
        <text x="363" y="148" fill="#171717" stroke="none" opacity="0.58" font-size="10">Ready</text>
      </g>
      <g opacity="0.45" stroke-opacity="0.65"><path d="M128 344H432 M128 337v14 M432 337v14 m-308-3 8-8 m296 8 8-8"/><path d="M180 326H204 M180 322v8 M204 322v8"/></g>
      <g fill="#171717" font-size="10" opacity="0.58" stroke="none">
        <text x="164" y="104" text-anchor="middle">01</text><text x="252" y="104" text-anchor="middle">02</text><text x="373" y="104" text-anchor="middle">03</text>
        <text x="280" y="364" text-anchor="middle">3 parts / 1 composition</text>
      </g>
      <g opacity="0.32" stroke-opacity="0.6"><path d="M100 82h12 M106 76v12 M448 342h12 M454 336v12"/><path d="M266 382h28 M280 376v12"/></g>
    </svg>
  </main>
  <script>
    (() => {
      const duration = 10.4;
      const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
      const parts = [
        { name: 'icon', enter: 0.9, leave: 6.9, x: 0 },
        { name: 'label', enter: 1.3, leave: 6.5, x: -11 },
        { name: 'pill', enter: 1.7, leave: 6.1, x: 0 }
      ].map(part => ({ ...part,
        element: document.getElementById(`part-${part.name}`),
        slot: document.getElementById(`slot-${part.name}`),
        route: document.getElementById(`route-${part.name}`)
      }));
      const measure = document.getElementById('measure-label');
      const clamp = value => Math.min(1, Math.max(0, value));
      const ease = value => { const p = clamp(value); return p * p * p * (p * (6 * p - 15) + 10); };
      const arrival = (time, part) => ease((time - part.enter) / 1.45) * (1 - ease((time - part.leave) / 1.45));
      function render(time) {
        for (const part of parts) {
          const p = arrival(time, part);
          part.element.setAttribute('transform', `translate(${part.x * p} ${137 * p})`);
          part.slot.setAttribute('opacity', String(0.13 * (1 - p)));
          part.route.setAttribute('opacity', String(0.34 - 0.28 * p));
          if (part.name === 'label') measure.setAttribute('opacity', String(0.45 - 0.37 * p));
        }
      }
      let frame = 0;
      let start = 0;
      let paused = false;
      function tick(now) {
        render(((now - start) / 1000) % duration);
        frame = requestAnimationFrame(tick);
      }
      function play() {
        cancelAnimationFrame(frame);
        if (paused) return;
        if (reduceMotion.matches) { render(4.4); return; }
        start = performance.now();
        render(0);
        frame = requestAnimationFrame(tick);
      }
      window.study = {
        duration,
        seek(seconds) {
          if (!Number.isFinite(seconds)) throw new TypeError('seek requires a finite number of seconds');
          paused = true;
          cancelAnimationFrame(frame);
          render(Math.min(duration, Math.max(0, seconds)));
        }
      };
      reduceMotion.addEventListener('change', play);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) cancelAnimationFrame(frame);
        else play();
      });
      play();
    })();
  </script>
</body>
</html>
