<!doctype html>
<html lang="en">

<title>One request, B to 02</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #fff; }
  body { font-family: "Cal Sans", sans-serif; font-optical-sizing: auto; font-synthesis: none; }
  figure { width: 100%; max-width: 560px; margin: 0 auto; }
  svg { display: block; width: 100%; height: auto; aspect-ratio: 560 / 440; }

<body>
<figure aria-label="Switching matrix with selected route B to 02">
<svg xmlns="http://www.w3.org/2000/svg" fill="none" focusable="false" stroke="#171717" stroke-width="1" stroke-opacity="0.8" viewBox="0 0 560 440" style="overflow:visible;font-family:Cal Sans, sans-serif;font-optical-sizing:auto;font-synthesis:none;font-variation-settings:'GEOM' 25;font-weight:400;color:#171717" width="560" height="440" role="img" aria-labelledby="sys-02-plotter-title" aria-describedby="sys-02-plotter-desc"><title id="sys-02-plotter-title">One request, B to 02</title><desc id="sys-02-plotter-desc">Three inputs meet three outputs on a regular switching grid. A single closed junction connects B to 02. One request follows the dark route from input B, through the selected junction, to output 02. The still shows the request received at 02.</desc><g opacity="0.1" stroke-width="1" stroke-opacity="0.6"><path d="M184 100V324 M248 100V324 M312 100V324 M376 100V324" /><path d="M168 116H392 M168 180H392 M168 244H392 M168 308H392" /></g><g opacity="0.28" stroke-width="1" stroke-opacity="0.6"><path d="M176 116h8v-8 M376 108v8h8 M176 308h8v8 M376 316v-8h8" /><path d="M280 88V112 M104 212H112 M400 212H424 M280 308V320" stroke-dasharray="3 5" /><rect height="32" width="32" x="264" y="196" /><circle cx="280" cy="212" r="16" /><path d="M291.3 200.7 328 164H372" /></g><g opacity="0.4" stroke-width="1" stroke-opacity="0.75"><path d="M124 148H212 M220 148H276 M284 148H340 M348 148H392" /><path d="M284 212H340 M348 212H392" /><path d="M124 276H212 M220 276H276 M284 276H340 M348 276H392" /><path d="M216 100V144 M216 152V208 M216 216V272 M216 280V336" /><path d="M280 100V144 M280 152V208" /><path d="M344 100V144 M344 152V208 M344 216V272 M344 280V336" /></g><path d="M124 212H212 M220 212H276 M280 216V272 M280 280V336" stroke-width="1" stroke-opacity="1" /><g stroke-width="1" stroke-opacity="0.7"><circle cx="216" cy="148" r="4" /><circle cx="216" cy="212" r="4" /><circle cx="216" cy="276" r="4" /><circle cx="280" cy="148" r="4" /><circle cx="280" cy="212" r="4" /><circle cx="280" cy="276" r="4" /><circle cx="344" cy="148" r="4" /><circle cx="344" cy="212" r="4" /><circle cx="344" cy="276" r="4" /></g><circle cx="280" cy="212" fill="#171717" r="3" stroke="none" /><g stroke-width="1" stroke-opacity="0.85"><circle cx="120" cy="148" r="4" /><circle cx="120" cy="212" r="4" /><circle cx="120" cy="276" r="4" /><circle cx="216" cy="340" r="4" /><circle cx="280" cy="340" r="4" /><circle cx="344" cy="340" r="4" /></g><g opacity="0.48" stroke-width="1" stroke-opacity="0.65"><path d="M216 76H344 M216 68v16 M280 68v16 M344 68v16 m-132-4 8-8 m56 8 8-8 m56 8 8-8" /><path d="M424 148V276 M416 148h16 M416 212h16 M416 276h16 m-12-124 8-8 m-8 72 8-8 m-8 72 8-8" /><path d="M216 92V64 M344 92V64 M400 148H440 M400 276H440" opacity="0.5" /></g><g fill="#171717" font-size="10" opacity="0.52" stroke="none"><text text-anchor="middle" x="248" y="61">u</text><text text-anchor="middle" x="312" y="61">u</text><text x="438" y="184">u</text><text x="438" y="248">u</text><text x="380" y="167">B / 02</text><g text-anchor="end"><text x="100" y="152">A</text><text x="100" y="216">B</text><text x="100" y="280">C</text></g><g text-anchor="middle"><text x="216" y="365">01</text><text x="280" y="365">02</text><text x="344" y="365">03</text></g></g><g opacity="0.28" stroke-width="1" stroke-opacity="0.6"><path d="M100 96h12 M106 90v12 M448 354h12 M454 348v12" /></g>
  <!-- The filled request marker is a conceptual signal, not a new junction. -->
  <circle id="request" cx="280" cy="340" r="3" fill="#171717" stroke="none" />
</svg>

</figure>
<script>
(() => {
  "use strict";
  // Conceptual transfer: 160 units right, then 128 units down. The
  // closed junction and every original stroke remain fixed throughout.
  const duration = 5.4;
  const stillTime = 3.8;
  const beats = { enter: 0.35, visible: 0.55, depart: 0.9, arrive: 3.3, release: 4.3, clear: 4.6 };
  const source = { x: 120, y: 212 };
  const junction = { x: 280, y: 212 };
  const destination = { x: 280, y: 340 };
  const firstLeg = junction.x - source.x;
  const routeLength = firstLeg + destination.y - junction.y;
  const marker = document.getElementById("request");
  const diagram = document.querySelector("figure");
  const reduced = matchMedia("(prefers-reduced-motion: reduce)");
  const clamp = (value, low, high) => Math.max(low, Math.min(high, value));
  const smooth = value => value * value * (3 - 2 * value);

  function render(time) {
    const progress = clamp((time - beats.depart) / (beats.arrive - beats.depart), 0, 1);
    const distance = progress * routeLength;
    const x = source.x + Math.min(firstLeg, distance);
    const y = source.y + Math.max(0, distance - firstLeg);
    let opacity = 1;
    if (time < beats.visible) opacity = smooth(clamp((time - beats.enter) / (beats.visible - beats.enter), 0, 1));
    if (time > beats.release) opacity = 1 - smooth(clamp((time - beats.release) / (beats.clear - beats.release), 0, 1));
    marker.setAttribute("cx", x);
    marker.setAttribute("cy", y);
    marker.setAttribute("opacity", opacity);
  }

  let pausedForReview = false;
  let onScreen = true;
  let elapsed = 0;
  let previous = null;
  let frame = null;

  function tick(now) {
    if (previous !== null) elapsed += (now - previous) / 1000;
    previous = now;
    render(elapsed % duration);
    frame = requestAnimationFrame(tick);
  }

  function synchronize() {
    if (frame !== null) cancelAnimationFrame(frame);
    frame = null;
    previous = null;
    if (pausedForReview) return;
    if (reduced.matches) {
      render(stillTime);
      return;
    }
    if (!document.hidden && onScreen) frame = requestAnimationFrame(tick);
  }

  window.study = {
    duration,
    seek(seconds) {
      if (!Number.isFinite(seconds)) throw new TypeError("seek requires finite seconds");
      pausedForReview = true;
      elapsed = clamp(seconds, 0, duration);
      synchronize();
      render(elapsed);
    }
  };

  reduced.addEventListener("change", synchronize);
  document.addEventListener("visibilitychange", synchronize);
  if ("IntersectionObserver" in window) {
    new IntersectionObserver(entries => {
      onScreen = entries[0].isIntersecting;
      synchronize();
    }).observe(diagram);
  }
  render(reduced.matches ? stillTime : 0);
  synchronize();
})();
</script>
</body>
</html>
