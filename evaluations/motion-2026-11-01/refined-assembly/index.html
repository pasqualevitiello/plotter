<script>
(() => {
  'use strict';
  const duration = 8;
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
  const still = document.getElementById('still');
  const motion = document.getElementById('motion');
  const svg = document.querySelector('svg');
  const nodes = Object.fromEntries([...motion.querySelectorAll('[id]')].map(node => [node.id, node]));
  const clamp = value => Math.max(0, Math.min(1, value));
  const placement = u => { u = clamp(u); return u*u*u*(u*(u*6-15)+10); };
  const release = u => { u = clamp(u); return (1-Math.cos(Math.PI*u))/2; };
  // Each move has its own beat; the fixed carrier is the spatial reference.
  const parts = [
    { id: 'icon', inAt: .8, inFor: .9, outAt: 5.3, outFor: 1.2, dx: 0, dy: 137 },
    { id: 'label', inAt: 1.35, inFor: .9, outAt: 5, outFor: 1.2, dx: -11, dy: 137 },
    { id: 'pill', inAt: 1.9, inFor: .9, outAt: 4.7, outFor: 1.2, dx: 0, dy: 137 }
  ];
  function progress(part, t) {
    return placement((t-part.inAt)/part.inFor) * (1-release((t-part.outAt)/part.outFor));
  }
  function render(t) {
    still.style.display = 'none';
    motion.style.display = '';
    const positions = {};
    for (const part of parts) {
      const p = progress(part, t);
      positions[part.id] = p;
      const transform = `translate(${part.dx*p} ${part.dy*p})`;
      nodes[part.id].setAttribute('transform', transform);
      nodes[part.id+'-clearance'].setAttribute('transform', transform);
      // These guides describe only the remaining travel. They withdraw before contact.
      const arrows = t < 4.7 ? 1-placement(p/.38) : placement((t-6.5)/.3);
      nodes[part.id+'-arrow'].setAttribute('opacity', arrows);
      nodes[part.id+'-projection'].setAttribute('opacity', 1-placement(p/.72));
    }
    nodes['label-dimension'].setAttribute('opacity', 1-placement(positions.label/.18));
    nodes['gap-dimension'].setAttribute('opacity', placement(Math.min(positions.icon,positions.label)));
    svg.dataset.time = t.toFixed(4);
  }
  function showStill() {
    still.style.display = '';
    motion.style.display = 'none';
    delete svg.dataset.time;
  }
  let elapsed = 0;
  let previous = null;
  let frame = 0;
  let inView = true;
  let inspecting = false;
  const canPlay = () => !inspecting && !reducedMotion.matches && !document.hidden && inView;
  function tick(now) {
    frame = 0;
    if (!canPlay()) { previous = null; return; }
    if (previous !== null) elapsed = (elapsed + (now-previous)/1000) % duration;
    previous = now;
    render(elapsed);
    frame = requestAnimationFrame(tick);
  }
  function syncPlayback() {
    cancelAnimationFrame(frame);
    frame = 0;
    previous = null;
    if (reducedMotion.matches && !inspecting) showStill();
    else if (canPlay()) frame = requestAnimationFrame(tick);
  }
  window.study = Object.freeze({
    duration,
    seek(seconds) {
      if (!Number.isFinite(seconds)) throw new TypeError('seek expects a finite number of seconds');
      inspecting = true;
      cancelAnimationFrame(frame);
      frame = 0;
      previous = null;
      elapsed = Math.max(0, Math.min(duration, seconds));
      render(elapsed);
    }
  });
  reducedMotion.addEventListener('change', () => {
    inspecting = false;
    elapsed = 0;
    syncPlayback();
  });
  document.addEventListener('visibilitychange', syncPlayback);
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(entries => {
      inView = entries[0].isIntersecting;
      syncPlayback();
    }, { threshold: 0 }).observe(svg);
  }
  syncPlayback();
})();
</script>
</body>
</html>
