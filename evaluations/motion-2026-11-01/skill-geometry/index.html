<body><figure aria-label="Animated construction of a constant-offset corner"><svg xmlns="http://www.w3.org/2000/svg" width="560" height="440" viewBox="0 0 560 440" fill="none" stroke="currentColor" stroke-width="1" role="img" aria-labelledby="title description">

<desc id="description">The outer radius varies from 104 to 80 construction units. The inner radius stays exactly 24 units smaller. Both arcs have one fixed center.</desc>

<script>
(() => {
'use strict';
// The packaged foundation generates the live dimensions from their witnesses.
const standard = {geometry:{dimension:{slashExtent:8}}};
function finite(value, name) {
  if (typeof value !== "number" || !Number.isFinite(value)) {
    throw new TypeError(`${name} must be a finite number.`);
  }
  return value;
}

function point(value, name) {
  if (!Array.isArray(value) || value.length !== 2) {
    throw new TypeError(`${name} must be an [x, y] point.`);
  }
  return value.map((coordinate, axis) =>
    finite(coordinate, `${name}[${axis}]`),
  );
}

function nonnegative(value, name) {
  finite(value, name);
  if (value < 0) throw new RangeError(`${name} cannot be negative.`);
  return value;
}

function positive(value, name) {
  finite(value, name);
  if (value <= 0) throw new RangeError(`${name} must be positive.`);
  return value;
}

function number(value) {
  return String(Number(finite(value, "Computed coordinate").toFixed(6)));
}

function coordinates([x, y]) {
  return `${number(x)} ${number(y)}`;
}

function segment(from, to) {
  return `M${coordinates(from)}L${coordinates(to)}`;
}

function dimension({ axis, witnesses, position, extensions, label }) {
  if (axis !== "x" && axis !== "y") {
    throw new RangeError('Dimension axis must be "x" or "y".');
  }
  if (!Array.isArray(witnesses) || witnesses.length !== 2) {
    throw new TypeError("A dimension needs two feature witnesses.");
  }
  const ends = witnesses.map((witness, i) => point(witness, `witnesses[${i}]`));
  const along = axis === "x" ? 0 : 1;
  const across = 1 - along;
  const start = ends[0][along];
  const end = ends[1][along];
  if (start >= end)
    throw new RangeError(
      "Dimension witnesses must be in increasing axis order.",
    );
  finite(position, "position");
  const gap = nonnegative(extensions.gap, "extensions.gap");
  const overshoot = nonnegative(extensions.overshoot, "extensions.overshoot");
  if (typeof label.text !== "string")
    throw new TypeError("Dimension label text must be a string.");
  const anchor = point(label.anchor, "label.anchor");
  const onLine = (value) =>
    axis === "x" ? [value, position] : [position, value];
  const witnessD = ends
    .map((witness) => {
      const distance = position - witness[across];
      if (Math.abs(distance) < gap || distance === 0) {
        throw new RangeError(
          "A dimension line must leave room for its witness gap.",
        );
      }
      const direction = Math.sign(distance);
      const from = [...witness];
      const to = [...witness];
      from[across] += direction * gap;
      to[across] = position + direction * overshoot;
      return segment(from, to);
    })
    .join(" ");

  let spans = [[start, end]];
  if (label.clearance) {
    const { x, y, width, height } = label.clearance;
    finite(x, "label.clearance.x");
    finite(y, "label.clearance.y");
    positive(width, "label.clearance.width");
    positive(height, "label.clearance.height");
    const low = [x, y];
    const high = [x + width, y + height];
    if (position >= low[across] && position <= high[across]) {
      const cutStart = Math.max(start, low[along]);
      const cutEnd = Math.min(end, high[along]);
      if (cutStart < cutEnd) {
        spans = [
          [start, cutStart],
          [cutEnd, end],
        ].filter(([a, b]) => a < b);
        if (!spans.length) {
          throw new RangeError(
            "The label clearance consumes the dimension; move the label outside it.",
          );
        }
      }
    }
  }

  const halfSlash = standard.geometry.dimension.slashExtent / 2;
  const slashD = [onLine(start), onLine(end)]
    .map(([x, y]) =>
      segment([x - halfSlash, y + halfSlash], [x + halfSlash, y - halfSlash]),
    )
    .join(" ");
  return {
    witnessD,
    lineD: spans.map(([a, b]) => segment(onLine(a), onLine(b))).join(" "),
    slashD,
    label: { text: label.text, anchor },
  };
}


function geometry(radius) {
  const cx = 282, cy = 212, offset = 24;
  const inner = radius - offset, top = cy - radius, innerTop = cy - inner;
  const right = cx + radius, innerRight = cx + inner;
  const diagonal = radius / Math.sqrt(2), px = cx + diagonal, py = cy - diagonal;
  const labelDistance = inner/2 + 7.5;
  const labelX = cx + (labelDistance-7)/Math.sqrt(2), labelY = cy - (labelDistance+7)/Math.sqrt(2);
  const dim = (axis, witnesses, position, text, anchor) => dimension({axis,witnesses,position,extensions:{gap:8,overshoot:7},label:{text,anchor}});
  const horizontal = dim('x',[[cx,top],[right,top]],78,'r',[(cx+right)/2,67]);
  const vertical = dim('y',[[right,top],[right,cy]],417,'r',[430,(top+cy)/2+4]);
  const thickness = dim('x',[[innerRight,318],[right,318]],345,'24',[(innerRight+right)/2,367]);
  return {
    'outer': {d:`M140 ${top}H${cx}A${radius} ${radius} 0 0 1 ${right} ${cy}V318`},
    'inner': {d:`M140 ${innerTop}H${cx}A${inner} ${inner} 0 0 1 ${innerRight} ${cy}V318`},
    'ends': {d:`M140 ${top-4}V${innerTop+4} M${innerRight-4} 318H${right+4}`},
    'outer-locus': {d:`M${right} ${cy}A${radius} ${radius} 0 1 1 ${cx} ${top}`},
    'inner-locus': {d:`M${innerRight} ${cy}A${inner} ${inner} 0 1 1 ${cx} ${innerTop}`},
    'corner-envelope': {d:`M${cx+8} ${top}H${right}V${cy-8}`},
    'corner-cross': {d:`M${right} ${top-14}V${top+14} M${right-14} ${top}H${right+14}`},
    'radius-line': {d:`M${cx+2.5/Math.sqrt(2)} ${cy-2.5/Math.sqrt(2)}L${px} ${py} M${px-7} ${py}H${px}V${py+7}`},
    'top-dim': {d:horizontal.lineD+' '+horizontal.slashD},
    'top-witness': {d:horizontal.witnessD},
    'side-dim': {d:vertical.lineD+' '+vertical.slashD},
    'side-witness': {d:vertical.witnessD},
    'offset-dim': {d:thickness.lineD+' '+thickness.slashD},
    'offset-witness': {d:thickness.witnessD},
    'offset-leader': {d:`M140 ${top+12}H113L101 ${top+24}`},
    'top-point': {cx:cx,cy:top},
    'side-point': {cx:right,cy:cy},
    'top-label': {x:horizontal.label.anchor[0],y:horizontal.label.anchor[1]},
    'side-label': {x:vertical.label.anchor[0],y:vertical.label.anchor[1]},
    'offset-label': {x:thickness.label.anchor[0],y:thickness.label.anchor[1]},
    'radius-label': {text:`R${radius.toFixed(1)}`,x:labelX,y:labelY,transform:`rotate(-45 ${labelX} ${labelY})`},
    'offset-name': {y:top+39}
  };
}
const duration = 8;
const minimum = 80, maximum = 104;
const smooth = t => t*t*t*(t*(t*6-15)+10);
function radiusAt(t) {
  if (t < 0.9) return maximum;
  if (t < 3.1) return maximum - 24*smooth((t-0.9)/2.2);
  if (t < 4.9) return minimum;
  if (t < 7.1) return minimum + 24*smooth((t-4.9)/2.2);
  return maximum;
}
const nodes = Object.fromEntries(Object.keys(geometry(104)).map(id=>[id,document.getElementById(id)]));
function renderAt(seconds) {
  const radius = radiusAt(seconds);
  for (const [id, attributes] of Object.entries(geometry(radius))) {
    for (const [name,value] of Object.entries(attributes)) {
      if (name === 'text') nodes[id].textContent = value;
      else nodes[id].setAttribute(name,value);
    }
  }
  return {time:seconds, radius, innerRadius:radius-24, offset:24, center:[282,212]};
}
const reduced = matchMedia('(prefers-reduced-motion: reduce)');
let time = 0, previous = null, raf = null, reviewing = false, visible = true;
function stop() { if (raf !== null) cancelAnimationFrame(raf); raf = null; previous = null; }
function tick(now) {
  raf = null;
  if (previous !== null) time = (time + (now-previous)/1000) % duration;
  previous = now;
  renderAt(time);
  raf = requestAnimationFrame(tick);
}
function reconcile() {
  stop();
  if (reviewing) return;
  if (reduced.matches) { time = 0; renderAt(0); return; }
  if (!document.hidden && visible) raf = requestAnimationFrame(tick);
}
window.study = {
  duration,
  seek(seconds) {
    if (typeof seconds !== 'number' || !Number.isFinite(seconds)) throw new TypeError('Seek requires finite seconds.');
    reviewing = true;
    stop();
    time = Math.min(duration, Math.max(0, seconds));
    return renderAt(time);
  }
};
reduced.addEventListener('change', () => { reviewing = false; reconcile(); });
document.addEventListener('visibilitychange', reconcile);
if ('IntersectionObserver' in window) {
  new IntersectionObserver(([entry]) => { visible = entry.isIntersecting; reconcile(); }).observe(document.querySelector('figure'));
}
reconcile();
})();
</script>
