    <title id="srv-09-plotter-title">Supabase · A shared relation</title><desc id="srv-09-plotter-desc">Two Postgres table fragments connect a user’s primary key to project ownership. A single measured route expresses the relational foundation beneath an application.</desc><g opacity="0.1" stroke-width="1" stroke-opacity="0.6"><path d="M120 96V116M120 264V348M168 108V116M168 264V272M204 108V116M204 264V272M252 96V116M252 264V348M328 168V180M328 328V344M376 328V344M412 328V344M460 168V180M460 328V344M104 124H112M260 124H272M104 160H112M260 160H272M104 192H112M260 192H320M468 192H480M104 224H112M260 224H272M104 256H112M260 256H320M468 256H480M312 288H320M468 288H480M312 320H320M468 320H480" /></g><g opacity="0.27" stroke-width="1" stroke-opacity="0.6"><path d="M104 176H112M468 272H480" stroke-dasharray="4 5" /><path d="M272 168V224M264 200H308M296 248H320M320 232V280" stroke-dasharray="3 5" /><path d="M120 92H172M200 92H252M120 84V100M252 84V100m-136-4 8-8m124 8 8-8" /><path d="M328 352H380M408 352H460M328 344V360M460 344V360m-136-4 8-8m124 8 8-8" /><path d="M96 160V192M90 160H102M90 192H102" /></g><g stroke-width="1" stroke-opacity="0.95"><path d="M256 176H272A24 24 0 0 1 296 200V248A24 24 0 0 0 320 272H324" /><path d="M252 172V130a6 6 0 0 0-6-6H126a6 6 0 0 0-6 6V250a6 6 0 0 0 6 6H246a6 6 0 0 0 6-6V180" /><path d="M328 268V194a6 6 0 0 1 6-6H454a6 6 0 0 1 6 6V314a6 6 0 0 1-6 6H334a6 6 0 0 1-6-6V276" /><path d="M120 160H252M328 224H460" opacity="0.72" /><path d="M120 192H252M120 224H252M328 256H460M328 288H460" opacity="0.35" /><circle cx="252" cy="176" r="4" /><circle cx="328" cy="272" r="4" /></g><g opacity="0.4" stroke-width="1" stroke-opacity="0.65"><path d="M272 200 288.97 183.03M266 200H278M272 194V206" /><path d="M204 170V182M200 176H208M412 266V278M408 272H416" /><path d="M280 220H312M292 216V224M300 216V224" /><path d="M120 280H252M120 276V284M252 276V284" /></g><g fill="#f0f6fc" font-size="11" opacity="0.72" stroke="none"><text x="136" y="147">Users</text><te