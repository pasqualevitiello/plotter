<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" style="background-color:#0d1117;font-family:Cal Sans,sans-serif;font-optical-sizing:auto;font-synthesis:none;font-variation-settings:'GEOM' 25;--color-sidebar:#161b22;color:#f0f6fc;" fill="none" stroke="#f0f6fc">
  <rect width="1200" height="480" fill="#0d1117" stroke="none"/>
  <g transform="translate(20, 20)">
    <title id="tim-03-plotter-title">A week, constructed</title><desc id="tim-03-plotter-desc">Monday through Sunday on a measured hourly grid. One constructed circle locates a meeting on Thursday, from 10:00 to 11:00.</desc><g opacity="0.14" stroke-width="1" stroke-opacity="0.6"><path d="M140 80V344M420 80V344M132 140H452M132 300H452" /><path d="M280 130V326M132 200H436" stroke-dasharray="4 5" /></g><g opacity="0.5" stroke-width="1" stroke-opacity="0.9"><path d="M140 140H420V300H140Z" /><path d="M180 140V300M220 140V300M260 140V180M260 220V300M300 140V180M300 220V300M340 140V300M380 140V300" /><path d="M140 180H260M300 180H420M140 220H260M300 220H420M140 260H420" /></g><path d="M260 180H300V220H260Z" fill="#f0f6fc" data-plotter-fill="highlight" fill-opacity="0.055" stroke-width="1" stroke-opacity="0.95" /><circle cx="280" cy="200" r="16" stroke-width="1" stroke-opacity="1" /><g opacity="0.45" stroke-width="1" stroke-opacity="0.65"><path d="M256 200H304M280 176V224" stroke-dasharray="2 4" /><path d="M280 200 291.3 188.7" /><path d="M287.3 188.7h4v4" /></g><circle cx="280" cy="200" r="2" stroke-width="1" stroke-opacity="0.8" /><g opacity="0.42" stroke-width="1" stroke-opacity="0.65"><path d="M140 88H256M304 88H420M140 80V96M420 80V96" /><path d="m136 92 8-8m272 8 8-8" /><path d="M140 316V340M180 316V340M140 332H180" /><path d="m136 336 8-8m32 8 8-8" /><path d="M448 140V207M448 233V300M440 140H456M440 300H456" /><path d="m444 144 8-8m-8 168 8-8" /><path d="M128 128H140V140M420 300H432V312" /></g><g fill="#f0f6fc" font-size="11" opacity="0.72" stroke="none"><text text-anchor="middle" x="160" y="122">Mon</text><text text-anchor="middle" x="200" y="122">Tue</text><text text-anchor="middle" x="240" y="122">Wed</text><text text-anchor="middle" x="280" y="122">Thu</text><text text-anchor="middle" x="320" y="122">Fri</text><text text-anchor="middle" x="360" y="122">Sat</text><text text-anchor="middle" x="400" y="122">Sun</text></g><g fill="#f0f6fc" font-size="10" opacity="0.5" stroke="none"><text text-anchor="end" x="124" y="143">09:00</text><text text-anchor="end" x="124" y="183">10:00</text><text text-anchor="end" x="124" y="223">11:00</text><text text-anchor="end" x="124" y="263">12:00</text><text text-anchor="end" x="124" y="303">13:00</text><text text-anchor="middle" x="280" y="91">7 days</text><text text-anchor="middle" x="448" y="223">4 h</text><text text-anchor="middle" x="160" y="354">1 day</text><text text-anchor="middle" x="280" y="342">Thu · 10:00–11:00</text></g><g opacity="0.3" stroke-width="1" stroke-opacity="0.6"><path d="M99 96h12M105 90v12M443 356h12M449 350v12" /></g>
  </g>
  <g transform="translate(620, 20)">
    <title id="tim-05-plotter-title">Where schedules meet</title><desc id="tim-05-plotter-desc">Alex’s and Sam’s availability meet in one shared slot. Named bands and a meeting callout make the overlap explicit.</desc><g opacity="0.1" stroke-width="1" stroke-opacity="0.6"><path d="M160 84V148M160 236V324M208 84V148M208 236V324M256 104V108M256 308V324M304 104V108M304 308V324M352 84V172M352 236V324M400 84V172M400 236V256" /><path d="M112 108H248M312 108H448M112 156H128M232 156H248M312 156H448M112 204H128M432 204H440M112 252H248M312 252H448M112 300H248M312 300H348" /></g><g opacity="0.26" stroke-width="1" stroke-opacity="0.6"><path d="M280 112V336M100 204H128M432 204H440" stroke-dasharray="5 5" /></g><g opacity="0.62" stroke-width="1" stroke-opacity="0.95"><path d="M256 180H136V228H256M304 180H424V228H304" /><path d="M256 180V108H304V180M256 228V300H304V228" /></g><rect fill="#f0f6fc" data-plotter-fill="highlight" fill-opacity="0.055" height="48" stroke-width="1" stroke-opacity="1" width="48" x="256" y="180" /><circle cx="280" cy="204" r="16" stroke-width="1" stroke-opacity="1" /><circle cx="280" cy="204" r="2" stroke-width="1" stroke-opacity="0.8" /><g opacity="0.42" stroke-width="1" stroke-opacity="0.65"><path d="M136 336V360M424 336V360M136 352H266M294 352H424" /><path d="m132 356 8-8m280 8 8-8" /><path d="M444 108H464M444 300H464M456 108V191M456 217V300" /><path d="m452 112 8-8m-8 200 8-8" /><path d="M256 64V80M304 64V80M256 76H304" /><path d="m252 80 8-8m40 8 8-8" /><path d="M304 228 352 292H452" /></g><g fill="#f0f6fc" font-size="10" opacity="0.5" stroke="none"><text text-anchor="middle" x="280" y="58">u</text><text text-anchor="middle" x="280" y="355">6u</text><text text-anchor="middle" x="456" y="207">4u</text></g><g fill="#f0f6fc" font-size="11" opacity="0.72" stroke="none"><text x="136" y="169">Alex’s availability</text><text text-anchor="middle" x="280" y="96">Sam’s availability</text><text x="360" y="276">Shared slot</text></g><g fill="#f0f6fc" font-size="10" opacity="0.5" stroke="none"><text x="360" y="310">30 min meeting</text></g><g opacity="0.3" stroke-width="1" stroke-opacity="0.6"><path d="M106 86h12M112 80v12M442 330h12M448 324v12" /></g>
