</style><title id="resilience-03-title">Resilience — rejoin</title><desc id="resilience-03-desc">A butterfly-shaped repair key aligns with an identical key across the seam of a rectangular form. Projections preserve the key’s width and a downward arrow indicates assembly.</desc><metadata>Mode: conceptual diagram. A repair key across a fracture is a limited metaphor for rebuilding after damage. This is not a joinery specification, load calculation, material claim, or manufacturability claim. Reference: INT-02, preserved fragments align into one assembled form. The loose and assembled keys are identical, separated by translation (0,160). Key width=64, height=48, each waist inset=16 SVG construction units. Projection guides follow the exact left and right extrema, stopping 10 units below the loose key and 10 units above the assembled rectangle. The seam is interrupted by the fitted key and shares no overlapping line segment with it.</metadata><g data-plotter-role="guide"><path d="M248 174V242 M312 174V192 M312 222V242"/></g><g data-plotter-role="primary"><path d="M248 116 H312 L296 140 L312 164 H248 L264 140 Z"/><rect x="112" y="252" width="336" height="96" rx="8"/><path d="M248 276 H312 L296 300 L312 324 H248 L264 300 Z"/></g><g data-plotter-role="secondary"><path d="M276 252L272 264L280 276 M280 324L288 336L284 348"/></g><g data-plotter-role="transfer"><path d="M280 232L280 182"/><path d="M275.757359 227.757359L280 232L284.242641 227.757359" stroke-dasharray="none"/></g><text x="298" y="211" fill="currentColor" stroke="none" font-size="11" opacity="0.72" text-anchor="start">Rejoin</text><g data-plotter-role="dimension"><path d="M248 108L248 78 M312 108L312 78 M248 84L267 84 M293 84L312 84 M244 88L252 80 M308 88L316 80"/></g><text x="280" y="88" fill="currentColor" stroke="none" font-size="10" opacity="0.5" text-anchor="middle">64</text></svg>
